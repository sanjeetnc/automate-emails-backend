<!DOCTYPE html>
<html>

<head>

  <title>Email Automation</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-900 text-white flex justify-center items-center h-screen">

  <div class="bg-slate-800 p-10 rounded-2xl">

    <h1 class="text-4xl font-bold mb-5">
      Email Automation 🚀
    </h1>

    <button
      class="bg-cyan-500 px-5 py-3 rounded-xl"
      onclick="sendMail()">

      Send Mail

    </button>

  </div>

<script>

async function sendMail() {

    const response = await fetch("/api/send/");

    const data = await response.json();

    alert(data.message);
}

</script>

</body>

</html>
