<button
onclick="sendEmails()"
class="bg-cyan-500 px-5 py-3 rounded-xl">

Send Emails

</button>

<script>

async function sendEmails() {

    const response = await fetch('/send-sheet/');

    const data = await response.json();

    alert(
        `Total Emails Sent: ${data.total_emails_sent}`
    );
}

</script>
